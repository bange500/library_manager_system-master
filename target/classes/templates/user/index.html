<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>普通用户-图书管理系统</title>
    <link href="/layui/css/layui.css" rel="stylesheet"/>
    <style>
        /* 轮播图 */
        #index .layui-carousel-item {
            position: relative;
            cursor: pointer;
        }
        #index .layui-carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .carousel-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            padding: 14px 20px;
            font-size: 18px;
            text-align: center;
            z-index: 10;
        }
        /* 公告列表 */
        .announcement-section {
            margin-top: 30px;
            padding: 0 20px;
        }
        .section-title {
            font-size: 20px;
            font-weight: bold;
            border-left: 4px solid #5FB878;
            padding-left: 12px;
            margin-bottom: 20px;
            color: #333;
        }
        .announcement-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #e6e6e6;
            transition: background 0.2s;
            cursor: pointer;
        }
        .announcement-item:hover {
            background: #f6f6f6;
        }
        .announcement-item .type-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 3px;
            font-size: 12px;
            margin-right: 14px;
            flex-shrink: 0;
            color: #fff;
        }
        .type-activity { background: #FFB800; }
        .type-announcement { background: #5FB878; }
        .announcement-item .item-title {
            flex: 1;
            font-size: 15px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .announcement-item .item-time {
            font-size: 13px;
            color: #999;
            margin-left: 16px;
            flex-shrink: 0;
        }
        .empty-tip {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">

    <div th:insert="~{common/user_header :: header}"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">

                <li class="layui-nav-item ">
                    <a class="" href="javascript:;">借阅管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/userBorrowBookRecord">&emsp;&emsp;借书记录</a></dd>
                        <dd><a href="/borrowingPage">&emsp;&emsp;借阅书籍</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">书籍管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/userReturnBooksPage">&emsp;&emsp;归还书籍</a></dd>
                        <dd><a href="/findBookPage">&emsp;&emsp;查询书籍</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item">
                    <a class="" href="javascript:;">预约管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/userReservationsPage">&emsp;&emsp;我的预约</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>

    <div class="layui-body layui-container">
        <!-- 轮播图 -->
        <div class="layui-carousel layui-container" id="index" style="margin-top: 40px;">
            <div carousel-item>
                <div th:each="item : ${carouselList}"
                     th:attr="data-url=${'/announcementDetail?id=' + item.id}"
                     th:style="'background-image:url(' + ${item.coverImage} + ');background-size:cover;background-position:center;'">
                    <div class="carousel-caption" th:text="${item.title}"></div>
                </div>
                <div th:if="${#lists.isEmpty(carouselList)}">
                    <img src="/images/lib1.jpg"/>
                </div>
            </div>
        </div>

        <!-- 公告/活动列表 -->
        <div class="announcement-section">
            <div class="section-title">公告与活动</div>
            <div th:if="${#lists.isEmpty(announcementList)}" class="empty-tip">
                暂无公告或活动
            </div>
            <div th:each="item : ${announcementList}"
                 class="announcement-item"
                 th:onclick="|location.href='/announcementDetail?id=${item.id}'|">
                <span class="type-badge"
                      th:classappend="${item.type == 'activity' ? 'type-activity' : 'type-announcement'}"
                      th:text="${item.type == 'activity' ? '活动' : '公告'}"></span>
                <span class="item-title" th:text="${item.title}"></span>
                <span class="item-time" th:text="${#dates.format(item.createTime, 'yyyy-MM-dd')}"></span>
            </div>
        </div>
    </div>

    <div th:insert="~{common/footer :: footer}"></div>

</div>

<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script>

    layui.use(['carousel', 'element'], function () {
        var carousel = layui.carousel;
        var element = layui.element;

        carousel.render({
            elem: '#index'
            , width: '100%'
            , height: '450px'
            , arrow: 'hover'
            , indicator: 'inside'
            , autoplay: true
            , interval: 4000
        });

        // 轮播图点击跳转（多层委托，兼容 LayUI 渲染后的 DOM）
        $('#index').on('click', function (e) {
            var target = $(e.target).closest('div[data-url]');
            if (target.length) {
                location.href = target.attr('data-url');
            }
        });
    });

</script>

</body>
</html>
