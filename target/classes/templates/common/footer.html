<!DOCTYPE HTML>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>

            <!-- 左侧 -->
            <span>Variation - library - managerSystem</span>
            <!-- 右侧：管理员刷新推荐缓存按钮 -->

                    title="全量刷新Redis推荐缓存">
                <i class="layui-icon layui-icon-refresh"></i> 刷新推荐缓存
            </button>
        </div>
    </footer>
</head>
</html>
