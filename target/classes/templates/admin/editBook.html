<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理员-编辑图书</title>
    <link href="/layui/css/layui.css" rel="stylesheet" media="all"/>

</head>
<div class="layui-layout layui-layout-admin">

    <div th:insert="~{common/admin_header :: header}"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">

                <li class="layui-nav-item layui-nav-itemed">
                    <a class="" href="javascript:;">书籍管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/addBookPage">&emsp;&emsp;录入新书</a></dd>
                        <dd><a href="/addCategoryPage?pageNum=1">&emsp;&emsp;新建类别</a></dd>
                        <dd class="layui-this"><a href="/showBooksPage">&emsp;&emsp;查询书籍</a></dd>
                        <dd><a href="/importBooksPage">&emsp;&emsp;批量导入</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item ">
                    <a class="" href="javascript:;">用户管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/showUsersPage?pageNum=1">&emsp;&emsp;查询用户</a></dd>
                        <dd><a href="/addUserPage">&emsp;&emsp;新增用户</a></dd>
                        <dd><a href="/importUsersPage">&emsp;&emsp;批量导入</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item ">
                    <a class="" href="javascript:;">借阅信息</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/allBorrowBooksRecordPage?pageNum=1">&emsp;&emsp;所有记录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>

    <div class="layui-body layui-container"
         style="margin : 10px auto; padding:10px 16px ;border: 200px; width: 520px; height: auto; min-height: 580px; background-color: #f2f2f2">

        <hr class="layui-bg-blue">
        <h2 style="text-align:center">编辑图书</h2>
        <hr class="layui-bg-blue">

        <div style="width: 460px; padding: 20px; margin: auto auto; background-color: #f2f2f2">
            <form class="layui-form" id="editBookForm">

                <!-- 隐藏的 bookId 字段 -->
                <input type="hidden" name="bookId" th:value="${book.bookId}">

                <div class="layui-form-item">
                    <label class="layui-form-label">书 名</label>
                    <div class="layui-input-inline">
                        <input required lay-verify="required" id="bookName" type="text" name="bookName"
                               th:value="${book.bookName}" placeholder="请输入书名" autofocus
                               class="layui-input" autocomplete="off">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">作 者</label>
                    <div class="layui-input-inline">
                        <input id="bookAuthor" lay-verify="required" type="text" name="bookAuthor"
                               th:value="${book.bookAuthor}" placeholder="请输入作者"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">出版社</label>
                    <div class="layui-input-inline">
                        <input id="bookPublish" lay-verify="required" type="text" name="bookPublish"
                               th:value="${book.bookPublish}" placeholder="请输入出版社" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">I S B N</label>
                    <div class="layui-input-inline">
                        <input id="isbn" lay-verify="required|isbn" type="text" name="isbn"
                               th:value="${book.isbn}" placeholder="请输入ISBN编号" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">类 别</label>
                    <div class="layui-input-inline">
                        <select lay-verify="required" id="bookCategory" name="bookCategory">
                        </select>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">价 格</label>
                    <div class="layui-input-inline">
                        <input id="bookPrice" lay-verify="number" type="text" name="bookPrice"
                               th:value="${book.bookPrice}" placeholder="￥" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">出版日期</label>
                    <div class="layui-input-inline">
                        <input id="publishDate" lay-verify="date" type="text" name="publishDateStr"
                               th:value="${book.publishDateStr}" placeholder="yyyy-MM-dd"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">总库存</label>
                    <div class="layui-input-inline">
                        <input id="totalStock" lay-verify="required|stock" type="number" name="totalStock"
                               th:value="${book.totalStock}" placeholder="请输入库存数量"
                               autocomplete="off" class="layui-input" min="0">
                    </div>
                    <div class="layui-form-mid layui-word-aux">可借数量=总库存-已借出</div>
                </div>

                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">简 介</label>
                    <div class="layui-input-inline">
                    <textarea id="bookIntroduction" lay-verify="required" name="bookIntroduction"
                              placeholder="请输入简介" class="layui-textarea"
                              autocomplete="off" th:text="${book.bookIntroduction}"></textarea>
                    </div>
                </div>

                <div style="margin-left: 100px">
                    <input type="submit" lay-filter="btn1" id="btn1" class="layui-btn" lay-submit=""
                           value="保存修改">
                    <a href="/showBooksPage" class="layui-btn layui-btn-primary">返回</a>
                </div>

            </form>
        </div>

    </div>
    <div th:insert="~{common/footer :: footer}"></div>

</div>

<script th:inline="javascript">
    // 当前图书的原始分类ID和ISBN，供JS使用
    var originalCategoryId = [[${book.bookCategory != null ? book.bookCategory : 0}]];
    var originalIsbn = [[${book.isbn != null ? book.isbn : ''}]];
</script>
<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/scripts/admin/editBook.js"></script>

</body>
</html>
