<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理员-图书管理系统</title>
    <link href="/layui/css/layui.css" rel="stylesheet"/>

</head>
<div class="layui-layout layui-layout-admin">

    <div th:insert="~{common/admin_header :: header}"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <!-- 左侧导航区域（可配合layui已有的垂直导航） -->
            <ul class="layui-nav layui-nav-tree">

                <li class="layui-nav-item layui-nav-itemed">
                    <a class="" href="javascript:;">书籍管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/addBookPage">&emsp;&emsp;录入新书</a></dd>
                        <dd><a href="/addCategoryPage?pageNum=1">&emsp;&emsp;新建类别</a></dd>
                        <dd class="layui-this"><a href="/showBooksPage">&emsp;&emsp;查询书籍</a></dd>
                        <dd><a href="/importBooksPage">&emsp;&emsp;批量导入</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item ">
                    <a class="" href="javascript:;">用户管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/showUsersPage?pageNum=1">&emsp;&emsp;查询用户</a></dd>
                        <dd><a href="/addUserPage">&emsp;&emsp;新增用户</a></dd>
                        <dd><a href="/importUsersPage">&emsp;&emsp;批量导入</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item ">
                    <a class="" href="javascript:;">借阅信息</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/allBorrowBooksRecordPage?pageNum=1">&emsp;&emsp;所有记录</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>

    <div class="layui-body layui-container">

        <div class="layui-row">

            <div class="layui-col-md3"><!--左半部分-->

                <hr class="layui-bg-blue">
                <h2 style="text-align:center">查询书籍</h2>
                <hr class="layui-bg-blue">

                <form class="layui-form" action="/showBooksResultPageByCategoryId" id="bookCategoryForm">

                    <div class="layui-form-item">

                        <div style="margin: 20px;">
                            <label>按类别查找</label>
                        </div>

                        <div>
                            <select lay-verify="required" class="layui-select" id="bookCategory" name="bookCategory">
                            </select>
                        </div>
                    </div>

                    <input type="text" name="pageNum" value="1" style="display: none">

                    <input class="layui-btn" type="submit" lay-submit="" value="查找">
                </form>
            </div>

            <div class="layui-col-md7 layui-col-md-offset2"><!--右半部分-->

                <hr class="layui-bg-blue">
                <h2 style="text-align:center">查询结果</h2>
                <hr class="layui-bg-blue">


                <table class="layui-table" lay-size="sm">
                    <thead>
                    <tr>
                        <th>操作</th>
                        <th>id</th>
                        <th>书名</th>
                        <th>作者</th>
                        <th>出版社</th>
                        <th>状态</th>
                        <th>编辑</th>
                        <th>删除</th>
                    </tr>
                    </thead>

                    <!-- 有数据：渲染书籍列表 -->
                    <tr th:each="book:${page.getList()}">
                        <td>
                            <button class="layui-btn layui-btn-xs layui-btn-normal"
                                    th:attr="data-bookid=${book.getBookId()}"
                                    onclick="showBookDetail(this)">更多内容</button>
                        </td>
                        <td><label th:text="${book.getBookId()}"></label></td>
                        <td><label th:text="${book.getBookName()}"></label></td>
                        <td><label th:text="${book.getBookAuthor()}"></label></td>
                        <td><label th:text="${book.getBookPublish()}"></label></td>
                        <td><label th:text="${book.getIsExist()}"></label></td>
                        <td>
                            <a th:href="@{/editBookPage(bookId=${book.getBookId()})}"
                               class="layui-btn layui-btn-xs layui-btn-warm">编辑</a>
                        </td>
                        <td>
                            <button class="layui-btn layui-btn-sm layui-btn-danger btn_deleteBook"
                                    th:value="${book.getBookId()}"
                                    th:data-book-name="${book.getBookName()}">删除
                            </button>
                        </td>
                    </tr>

                    <!-- 无数据：空提示 -->
                    <tr th:if="${page == null || page.getList() == null || page.getList().isEmpty()}">
                        <td colspan="8" style="text-align:center; color:#999; padding:30px;">
                            <i class="layui-icon layui-icon-tips" style="font-size:24px; color:#ccc;"></i>
                            <p style="margin-top:8px;">
                                <span th:if="${bookCategory != null && bookCategory != 0}">该分类下暂无书籍数据</span>
                                <span th:unless="${bookCategory != null && bookCategory != 0}">请选择图书类别后点击【查找】</span>
                            </p>
                        </td>
                    </tr>

                    <!-- 分页导航 -->
                    <tr th:if="${page != null && page.getList() != null && !page.getList().isEmpty()}">
                        <td colspan="8">
                            <div style="margin: auto; width: 160px;">

                                <a id="prePage"
                                   th:href="@{/showBooksResultPageByCategoryId(pageNum=${page.getPageNum()-1},bookCategory=${bookCategory})}">
                                    <button class="layui-btn layui-btn-sm">上一页</button>
                                </a>
                                <label id="lab1" th:text="${page.getPageNum()}"></label>

                                <span>/</span>

                                <label id="lab2" th:text="${page.getPageCount()}"></label>
                                <a id="nextPage"
                                   th:href="@{/showBooksResultPageByCategoryId(pageNum=${page.getPageNum()+1},bookCategory=${bookCategory})}">
                                    <button class="layui-btn layui-btn-sm">下一页</button>
                                </a>
                            </div>

                        </td>
                    </tr>
                </table>

                <!-- 书籍详情展示区域（默认隐藏） -->
                <div id="bookDetailPanel" style="display:none; margin-top:20px; border:1px solid #e2e2e2; border-radius:4px; padding:20px; background:#f9f9f9;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h3 style="margin:0; color:#1E9FFF;">&emsp;书籍详情</h3>
                        <button class="layui-btn layui-btn-sm layui-btn-primary" onclick="closeBookDetail()">关闭</button>
                    </div>
                    <hr style="margin:10px 0;">

                    <!-- 基础信息 -->
                    <fieldset class="layui-elem-field">
                        <legend>基础信息</legend>
                        <div class="layui-field-box">
                            <table class="layui-table" lay-size="sm">
                                <colgroup>
                                    <col width="15%"><col width="35%"><col width="15%"><col width="35%">
                                </colgroup>
                                <tbody>
                                <tr>
                                    <td><b>编号</b></td>
                                    <td><span id="detail_bookId">-</span></td>
                                    <td><b>书名</b></td>
                                    <td><span id="detail_bookName">-</span></td>
                                </tr>
                                <tr>
                                    <td><b>作者</b></td>
                                    <td><span id="detail_bookAuthor">-</span></td>
                                    <td><b>出版社</b></td>
                                    <td><span id="detail_bookPublish">-</span></td>
                                </tr>
                                <tr>
                                    <td><b>借阅状态</b></td>
                                    <td><span id="detail_isExist" style="font-weight:bold;">-</span></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </fieldset>

                    <!-- 扩展信息 -->
                    <fieldset class="layui-elem-field">
                        <legend>扩展信息</legend>
                        <div class="layui-field-box">
                            <table class="layui-table" lay-size="sm">
                                <colgroup>
                                    <col width="15%"><col width="35%"><col width="15%"><col width="35%">
                                </colgroup>
                                <tbody>
                                <tr>
                                    <td><b>ISBN</b></td>
                                    <td><span id="detail_isbn">-</span></td>
                                    <td><b>书籍分类</b></td>
                                    <td><span id="detail_categoryName">-</span></td>
                                </tr>
                                <tr>
                                    <td><b>出版日期</b></td>
                                    <td><span id="detail_publishDate">-</span></td>
                                    <td><b>总库存</b></td>
                                    <td><span id="detail_totalStock">-</span></td>
                                </tr>
                                <tr>
                                    <td><b>可借数量</b></td>
                                    <td><span id="detail_availableCount" style="color:#5FB878;font-weight:bold;">-</span></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                                <tr>
                                    <td><b>内容简介</b></td>
                                    <td colspan="3"><span id="detail_bookIntroduction">-</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </fieldset>

                    <!-- 无数据兜底 -->
                    <div id="detail_empty" style="display:none; text-align:center; color:#999; padding:30px;">
                        <p>暂无更多内容</p>
                    </div>

                    <!-- 推荐图书模块（默认隐藏，随详情面板一起显示） -->
                    <div id="recommendPanel" style="margin-top:20px;">
                        <fieldset class="layui-elem-field">
                            <legend>&emsp;推荐图书&emsp;<span style="font-size:12px;color:#999;">（同类别）</span></legend>
                            <div class="layui-field-box">
                                <div id="recommendList" style="display:flex;gap:15px;flex-wrap:wrap;justify-content:space-between;"></div>
                                <div id="recommendEmpty" style="display:none;text-align:center;color:#999;padding:20px;">
                                    <p>暂无推荐图书</p>
                                </div>
                            </div>
                        </fieldset>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div th:insert="~{common/footer :: footer}"></div>

</div>

<script th:inline="javascript">
    // 保存当前选中的类别ID，避免页面刷新后重置
    var selectedCategory = [[${bookCategory != null ? bookCategory : 0}]];
</script>
<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/scripts/admin/showBooks.js"></script>

</body>
</html>
