<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理员-基本资料</title>
    <link href="/layui/css/layui.css" rel="stylesheet"/>
</head>

<div class="layui-layout layui-layout-admin">

    <div th:insert="~{common/admin_header :: header}"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">书籍管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/addBookPage">&emsp;&emsp;录入新书</a></dd>
                        <dd><a href="/addCategoryPage?pageNum=1">&emsp;&emsp;新建类别</a></dd>
                        <dd><a href="/showBooksPage">&emsp;&emsp;查询书籍</a></dd>
                        <dd><a href="/importBooksPage">&emsp;&emsp;批量导入</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">用户管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/showUsersPage?pageNum=1">&emsp;&emsp;查询用户</a></dd>
                        <dd><a href="/addUserPage">&emsp;&emsp;新增用户</a></dd>
                        <dd><a href="/importUsersPage">&emsp;&emsp;批量导入</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">借阅信息</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/allBorrowBooksRecordPage?pageNum=1">&emsp;&emsp;所有记录</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">公告管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/manageAnnouncementPage?pageNum=1">&emsp;&emsp;管理公告</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>

    <div class="layui-body layui-container">

        <hr class="layui-bg-blue">
        <h3 style="font-size: xx-large; text-align: center">基 本 资 料</h3>
        <hr class="layui-bg-blue">

        <div class="layui-row">
            <div class="layui-col-md8 layui-col-lg-offset2">
                <table class="layui-table">
                    <thead>
                    <tr>
                        <th>管理员ID</th>
                        <th>管理员姓名</th>
                        <th>管理员邮箱</th>
                    </tr>
                    </thead>
                    <tr>
                        <td><b th:text="${session.admin.getAdminId()}"></b></td>
                        <td><b th:text="${session.admin.getAdminName()}"></b></td>
                        <td><b th:text="${session.admin.getAdminEmail()}"></b></td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="layui-row">
            <button id="modify-info" class="layui-btn" style="display: block; margin: 10px auto;">修改资料</button>
        </div>

        <div id="window" title="修改资料" style="margin: 5%; display: none">
            <form id="updateAdminForm" class="layui-form">
                <div class="layui-form-item">
                    <label class="layui-form-label">姓名</label>
                    <div class="layui-input-block">
                        <input type="text" name="adminName" th:value="${session.admin.getAdminName()}" id="name"
                               class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">邮箱</label>
                    <div class="layui-input-block">
                        <input type="text" name="adminEmail" th:value="${session.admin.getAdminEmail()}" id="email"
                               class="layui-input">
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:insert="~{common/footer :: footer}"></div>

</div>

<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/scripts/admin/adminBasicInfo.js"></script>

</body>
</html>
