<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>公告管理 - 图书管理系统</title>
    <link href="/layui/css/layui.css" rel="stylesheet"/>
    <style>
        .toolbar {
            margin: 16px 0;
        }
        .pagination-bar {
            text-align: center;
            margin: 20px 0;
        }
        .pagination-bar a {
            display: inline-block;
            padding: 6px 14px;
            margin: 0 4px;
            border: 1px solid #ddd;
            border-radius: 3px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }
        .pagination-bar a:hover {
            background: #5FB878;
            color: #fff;
            border-color: #5FB878;
        }
        .pagination-bar a.current {
            background: #5FB878;
            color: #fff;
            border-color: #5FB878;
            font-weight: bold;
        }
        .pagination-bar a.disabled {
            color: #ccc;
            cursor: not-allowed;
        }
        .pagination-bar span {
            margin: 0 6px;
            color: #666;
        }
        .layui-table img {
            max-height: 50px;
        }
    </style>
</head>

<div class="layui-layout layui-layout-admin">

    <div th:insert="~{common/admin_header :: header}"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">

                <li class="layui-nav-item ">
                    <a class="" href="javascript:;">书籍管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/addBookPage">&emsp;&emsp;录入新书</a></dd>
                        <dd><a href="/addCategoryPage?pageNum=1">&emsp;&emsp;新建类别</a></dd>
                        <dd><a href="/showBooksPage">&emsp;&emsp;查询书籍</a></dd>
                        <dd><a href="/importBooksPage">&emsp;&emsp;批量导入</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">用户管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/showUsersPage?pageNum=1">&emsp;&emsp;查询用户</a></dd>
                        <dd><a href="/addUserPage">&emsp;&emsp;新增用户</a></dd>
                        <dd><a href="/importUsersPage">&emsp;&emsp;批量导入</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item ">
                    <a class="" href="javascript:;">借阅信息</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/allBorrowBooksRecordPage?pageNum=1">&emsp;&emsp;所有记录</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item layui-nav-itemed">
                    <a class="" href="javascript:;">公告管理</a>
                    <dl class="layui-nav-child">
                        <dd class="layui-this"><a href="/manageAnnouncementPage?pageNum=1">&emsp;&emsp;管理公告</a></dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>

    <div class="layui-body layui-container">
        <div class="toolbar">
            <button class="layui-btn" id="btnAdd">
                <i class="layui-icon layui-icon-add-1"></i> 新建公告/活动
            </button>
        </div>

        <!-- 表格 -->
        <table class="layui-table" lay-skin="line">
            <colgroup>
                <col width="50">
                <col width="200">
                <col width="80">
                <col width="80">
                <col width="80">
                <col width="150">
                <col width="160">
            </colgroup>
            <thead>
            <tr>
                <th>ID</th>
                <th>标题</th>
                <th>类型</th>
                <th>轮播展示</th>
                <th>封面图</th>
                <th>发布时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(page.list)}">
                <td colspan="7" style="text-align:center;color:#999;padding:40px;">暂无公告或活动数据</td>
            </tr>
            <tr th:each="item : ${page.list}">
                <td th:text="${item.id}"></td>
                <td>
                    <a th:href="${'/announcementDetail?id=' + item.id}" target="_blank"
                       th:text="${item.title}" style="color:#333;"></a>
                </td>
                <td>
                    <span th:if="${item.type == 'activity'}"
                          style="color:#fff;background:#FFB800;padding:2px 10px;border-radius:3px;font-size:12px;">活动</span>
                    <span th:if="${item.type == 'announcement'}"
                          style="color:#fff;background:#5FB878;padding:2px 10px;border-radius:3px;font-size:12px;">公告</span>
                </td>
                <td>
                    <span th:if="${item.isCarousel == 1}" style="color:#5FB878;">✓ 是</span>
                    <span th:if="${item.isCarousel == 0}" style="color:#ccc;">否</span>
                </td>
                <td>
                    <img th:if="${item.coverImage != null && !item.coverImage.isEmpty()}"
                         th:src="${item.coverImage}" style="max-height:40px;border-radius:3px;"
                         onerror="this.style.display='none'"/>
                    <span th:if="${item.coverImage == null || item.coverImage.isEmpty()}" style="color:#ccc;">无</span>
                </td>
                <td th:text="${#dates.format(item.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <button class="layui-btn layui-btn-sm btn-edit"
                            th:attr="data-id=${item.id}">编辑</button>
                    <button class="layui-btn layui-btn-sm layui-btn-danger btn-delete"
                            th:attr="data-id=${item.id}">删除</button>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- 分页 -->
        <div class="pagination-bar" th:if="${page.pageCount > 1}">
            <a th:if="${page.pageNum > 1}"
               th:href="${'/manageAnnouncementPage?pageNum=' + (page.pageNum - 1)}">上一页</a>
            <a th:if="${page.pageNum <= 1}" class="disabled" href="javascript:;">上一页</a>
            <span th:text="${'第 ' + page.pageNum + ' 页 / 共 ' + page.pageCount + ' 页'}"></span>
            <a th:if="${page.pageNum < page.pageCount}"
               th:href="${'/manageAnnouncementPage?pageNum=' + (page.pageNum + 1)}">下一页</a>
            <a th:if="${page.pageNum >= page.pageCount}" class="disabled" href="javascript:;">下一页</a>
        </div>
    </div>

    <div th:insert="~{common/footer :: footer}"></div>
</div>

<!-- 编辑/新增弹窗模板 -->
<script type="text/html" id="formTpl">
    <form class="layui-form" lay-filter="announcementForm" style="padding:20px 30px 0 0;">
        <input type="hidden" name="id" id="formId"/>
        <div class="layui-form-item">
            <label class="layui-form-label">类型</label>
            <div class="layui-input-block">
                <input type="radio" name="type" value="announcement" title="公告" checked/>
                <input type="radio" name="type" value="activity" title="活动"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">轮播展示</label>
            <div class="layui-input-block">
                <input type="radio" name="isCarousel" value="0" title="否" checked/>
                <input type="radio" name="isCarousel" value="1" title="是"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:red;">*</span> 标题</label>
            <div class="layui-input-block">
                <input type="text" name="title" lay-verify="required" class="layui-input" maxlength="200"
                       placeholder="请输入公告/活动标题"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">摘要</label>
            <div class="layui-input-block">
                <textarea name="summary" class="layui-textarea" maxlength="500" rows="2"
                          placeholder="简短摘要，展示在首页列表"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">封面图路径</label>
            <div class="layui-input-block">
                <input type="text" name="coverImage" class="layui-input" maxlength="500"
                       placeholder="如 /images/lib1.jpg"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:red;">*</span> 详细内容</label>
            <div class="layui-input-block">
                <textarea name="content" lay-verify="required" class="layui-textarea" rows="8"
                          placeholder="支持HTML标签"></textarea>
            </div>
        </div>
    </form>
</script>

<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/scripts/admin/manageAnnouncement.js"></script>
</body>
</html>
