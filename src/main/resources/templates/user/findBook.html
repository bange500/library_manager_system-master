<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>普通用户-图书管理系统</title>
    <link href="/layui/css/layui.css" rel="stylesheet"/>
</head>
<body class="layui-layout-body">

<div class="layui-layout layui-layout-admin">

    <div th:insert="~{common/user_header :: header}"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">

                <li class="layui-nav-item ">
                    <a class="" href="javascript:;">借阅管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/userBorrowBookRecord">&emsp;&emsp;借书记录</a></dd>
                        <dd><a href="/borrowingPage">&emsp;&emsp;借阅书籍</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item layui-nav-itemed">
                    <a class="" href="javascript:;">书籍管理</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/userReturnBooksPage">&emsp;&emsp;归还书籍</a></dd>
                        <dd class="layui-this"><a href="/findBookPage">&emsp;&emsp;查询书籍</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item"><a href="/userMessagePage">个人信息</a></li>
            </ul>
        </div>
    </div>

    <div class="layui-body layui-container">

        <div class="layui-row">

            <div class="layui-col-md3"><!--左半部分-->

                <hr class="layui-bg-blue">
                <h2 style="text-align:center">查询书籍</h2>
                <hr class="layui-bg-blue">

                <!-- 按类别查找 -->
                <form class="layui-form" action="/userShowBooksByCategory" id="bookCategoryForm">
                    <div class="layui-form-item">
                        <div style="margin: 10px 0;">
                            <label><b>按类别查找</b></label>
                        </div>
                        <div>
                            <select lay-verify="required" class="layui-select" id="bookCategory" name="bookCategory">
                            </select>
                        </div>
                    </div>
                    <input type="text" name="pageNum" value="1" style="display: none">
                    <input class="layui-btn layui-btn-sm" type="submit" lay-submit="" value="按类别查找">
                </form>

                <hr style="margin:20px 0;">

                <!-- 按书名查找 -->
                <form class="layui-form" action="/userFindBooksByKeyword" id="keywordForm">
                    <div class="layui-form-item">
                        <div style="margin: 10px 0;">
                            <label><b>按书名查找</b></label>
                        </div>
                        <div>
                            <input class="layui-input" type="text" name="bookPartInfo"
                                   placeholder="输入书名关键字" autocomplete="off" lay-verify="required">
                        </div>
                    </div>
                    <input type="text" name="pageNum" value="1" style="display: none">
                    <input type="hidden" name="bookCategory" id="keywordBookCategory" value="0">
                    <input class="layui-btn layui-btn-sm layui-btn-normal" type="submit" lay-submit="" value="按书名查找">
                </form>
            </div>

            <div class="layui-col-md7 layui-col-md-offset2"><!--右半部分-->

                <hr class="layui-bg-blue">
                <h2 style="text-align:center">查询结果</h2>
                <hr class="layui-bg-blue">

                <table class="layui-table" lay-size="sm">
                    <thead>
                    <tr>
                        <th>编号</th>
                        <th>书名</th>
                        <th>作者</th>
                        <th>出版社</th>
                        <th>状态</th>
                    </tr>
                    </thead>

                    <!-- 分页结果（类别搜索 / 关键字搜索） -->
                    <tr th:each="book:${page != null ? page.getList() : null}">
                        <td><label th:text="${book.getBookId()}"></label></td>
                        <td><label th:text="${book.getBookName()}"></label></td>
                        <td><label th:text="${book.getBookAuthor()}"></label></td>
                        <td><label th:text="${book.getBookPublish()}"></label></td>
                        <td><label th:text="${book.getIsExist()}"></label></td>
                    </tr>

                    <!-- 非分页结果（旧版关键字搜索兼容） -->
                    <tr th:each="book:${bookList}">
                        <td><label th:text="${book.getBookId()}"></label></td>
                        <td><label th:text="${book.getBookName()}"></label></td>
                        <td><label th:text="${book.getBookAuthor()}"></label></td>
                        <td><label th:text="${book.getBookPublish()}"></label></td>
                        <td><label th:text="${book.getIsExist()}"></label></td>
                    </tr>

                    <!-- 空结果提示 -->
                    <tr th:if="${(page == null || page.getList() == null || page.getList().isEmpty()) && (bookList == null || bookList.isEmpty())}">
                        <td colspan="5" style="text-align:center;color:#999;">请选择查询方式并输入条件</td>
                    </tr>

                    <!-- 分页导航 -->
                    <tr th:if="${page != null && page.getList() != null && !page.getList().isEmpty()}">
                        <td colspan="5">
                            <div style="margin: auto; width: 200px;">

                                <th:block th:if="${searchType == 'keyword'}">
                                    <a id="prePage"
                                       th:href="@{/userFindBooksByKeyword(pageNum=${page.getPageNum()-1},bookPartInfo=${keyword},bookCategory=${bookCategory})}">
                                        <button class="layui-btn layui-btn-sm">上一页</button>
                                    </a>
                                    <label id="lab1" th:text="${page.getPageNum()}"></label>
                                    <span>/</span>
                                    <label id="lab2" th:text="${page.getPageCount()}"></label>
                                    <a id="nextPage"
                                       th:href="@{/userFindBooksByKeyword(pageNum=${page.getPageNum()+1},bookPartInfo=${keyword},bookCategory=${bookCategory})}">
                                        <button class="layui-btn layui-btn-sm">下一页</button>
                                    </a>
                                </th:block>

                                <th:block th:unless="${searchType == 'keyword'}">
                                    <a id="prePage"
                                       th:href="@{/userShowBooksByCategory(pageNum=${page.getPageNum()-1},bookCategory=${bookCategory})}">
                                        <button class="layui-btn layui-btn-sm">上一页</button>
                                    </a>
                                    <label id="lab1" th:text="${page.getPageNum()}"></label>
                                    <span>/</span>
                                    <label id="lab2" th:text="${page.getPageCount()}"></label>
                                    <a id="nextPage"
                                       th:href="@{/userShowBooksByCategory(pageNum=${page.getPageNum()+1},bookCategory=${bookCategory})}">
                                        <button class="layui-btn layui-btn-sm">下一页</button>
                                    </a>
                                </th:block>

                            </div>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

    </div>

    <div th:insert="~{common/footer :: footer}"></div>

</div>


<script th:inline="javascript">
    // 保存当前选中的类别ID，避免页面刷新后重置
    var selectedCategory = [[${bookCategory != null ? bookCategory : 0}]];
</script>
<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/scripts/user/findBook.js"></script>

</body>
</html>
